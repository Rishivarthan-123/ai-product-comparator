<!DOCTYPE html>
<html>
<head>

  <meta property="og:title" content="Test Wireless Headphones" />

  <script type="application/ld+json">
  {
    "@context": "https://schema.org/",
    "@type": "Product",
    "name": "Test Wireless Headphones",
    "brand": {"@type": "Brand", "name": "ExampleAudio"},

      "priceCurrency": "INR",

      "seller": {"@type": "Organization", "name": "Example Store"},
      "warranty": "1 Year Warranty"
    },
    "aggregateRating": {
      "@type": "AggregateRating",
      "ratingValue": "4.5",
      "reviewCount": "120"
    }

</html>
